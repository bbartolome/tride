name: Publish image

# paths-ignore rather than an allow-list of paths: a `paths:` filter also
# applies to tag pushes, which would silently skip a release tag whose commit
# happened to touch nothing matching.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  IMAGE: bbartolome/tride
  REGISTRY_IMAGE: docker.io/bbartolome/tride

permissions:
  contents: read

jobs:
  # Each architecture builds natively on its own runner - free for public repos -
  # and pushes an untagged blob identified only by digest. Tagging happens once,
  # in the merge job, so a half-finished matrix never publishes a usable tag.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The image is ~5GB; runners ship with little headroom once the build
      # cache is also on disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/lib/node_modules || true
          docker image prune -af || true
          df -h /

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ref_name="${GITHUB_REF_NAME#v}"
            echo "IMAGE_REF=${{ env.IMAGE }}:${ref_name}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${{ env.IMAGE }}:latest" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_REF=${{ env.IMAGE_REF }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          # Word splitting is deliberate here: both substitutions expand into
          # multiple arguments (-t tag -t tag ..., then one ref per digest).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Proves the published image can still hand out its own installer, which is
  # the one behaviour a plain build cannot check.
  smoke:
    name: Smoke test dispenser
    runs-on: ubuntu-24.04
    needs: merge
    steps:
      - name: Dispenser emits a clean, parseable script
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker run --rm -e SETUP=true "$image" > boot.sh
          test -s boot.sh || { echo "dispenser produced no output" >&2; exit 1; }
          bash -n boot.sh
          grep -q '^IMAGE=' boot.sh
          head -5 boot.sh

      - name: Manifest covers both architectures
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker buildx imagetools inspect "$image" --raw \
            | jq -e '[.manifests[].platform.architecture] | index("amd64") and index("arm64")'

      - name: Artifacts present
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker run --rm "$image" bash -c "test -f /opt/webui/api/dist/main.js && test -f /opt/webui/web/browser/index.html"

      # The ABI regression test: proves the native module loads under the exact
      # interpreter webui-run.sh will use at runtime, not just under whatever
      # `node` happens to resolve to in PATH.
      - name: Native module loads
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker run --rm "$image" bash -c '"$(cat /opt/webui/.node-bin)" -e "require('"'"'/opt/webui/api/node_modules/@lydell/node-pty'"'"')"'

      - name: tmux present
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker run --rm "$image" tmux -V

  # Exercises the auth matrix end to end against the thin per-user layer built
  # on top of the just-published image. No tailnet is available here - the app
  # only ever reads a plain Tailscale-User-Login header, so curl -H stands in
  # for the tailnet-terminated header Tailscale Serve would normally add.
  webui-e2e:
    name: Web UI auth e2e
    runs-on: ubuntu-24.04
    needs: merge
    steps:
      - uses: actions/checkout@v4

      - name: Build per-user layer
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker build -t dc-test --build-arg BASE_IMAGE="$image" --build-arg SSH_USER=runner --build-arg HOST_HOME_DIR=/home src/installer

      # WEBUI_ADMIN_LOGINS seeds the allowlist (see src/cmd.sh's
      # write_webui_env) so /api/me has a known-good identity to check against.
      # No docker socket, authorized_keys or sudopass is provided - cmd.sh
      # tolerates all three being absent, so the container still starts clean.
      # WEBUI_REQUIRE_AUTH=true pins this container to the enforced-auth path;
      # the default (disabled) path is covered separately below.
      - name: Run container
        run: |
          set -euo pipefail
          docker run -d --name dc-test -e WEBUI_ADMIN_LOGINS=admin@example.com -e WEBUI_REQUIRE_AUTH=true dc-test

      - name: Wait for API to become healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker exec dc-test curl -fsS http://127.0.0.1:8088/healthz >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "web ui never became healthy" >&2
          docker logs dc-test || true
          exit 1

      - name: healthz responds 200
        run: |
          set -euo pipefail
          status="$(docker exec dc-test curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/healthz)"
          test "$status" = "200"

      - name: No identity header is rejected as 401
        run: |
          set -euo pipefail
          status="$(docker exec dc-test curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8088/api/me)"
          test "$status" = "401"

      - name: Seeded admin identity is accepted with role admin
        run: |
          set -euo pipefail
          body="$(docker exec dc-test curl -s -H 'Tailscale-User-Login: admin@example.com' http://127.0.0.1:8088/api/me)"
          echo "$body"
          echo "$body" | grep -q '"role":"admin"'

      - name: Unknown identity is rejected as 403
        run: |
          set -euo pipefail
          status="$(docker exec dc-test curl -s -o /dev/null -w '%{http_code}' -H 'Tailscale-User-Login: nobody@example.com' http://127.0.0.1:8088/api/me)"
          test "$status" = "403"

      # Proves the bind behaviourally rather than by reading a socket table:
      # `ss` is not in ubuntu:noble and iproute2 is not installed, so the
      # obvious check would fail with "command not found" and be reported as
      # a loopback violation. This tests the property that actually matters —
      # the API answers inside the container but is unreachable from outside
      # it, which is what keeps tailnet peers from bypassing Serve.
      - name: API is bound to loopback only
        run: |
          set -euo pipefail
          ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' dc-test)"
          test -n "$ip"
          docker exec dc-test curl -fsS http://127.0.0.1:8088/healthz >/dev/null
          if curl -fsS --max-time 5 "http://$ip:8088/healthz" >/dev/null 2>&1; then
            echo "web ui answered on $ip:8088 - it is NOT bound to loopback only" >&2
            exit 1
          fi
          echo "reachable on 127.0.0.1 inside the container, unreachable on $ip - loopback bind confirmed"

      - name: Clean up container
        if: always()
        run: docker rm -f dc-test || true

      # WEBUI_REQUIRE_AUTH is left unset here to pin down the actual shipped
      # default: no identity/allowlist check at all, every caller gets admin.
      - name: Run container (default auth config)
        run: |
          set -euo pipefail
          docker run -d --name dc-test-open dc-test

      - name: Wait for API to become healthy (default auth config)
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            if docker exec dc-test-open curl -fsS http://127.0.0.1:8088/healthz >/dev/null 2>&1; then
              echo "healthy"
              exit 0
            fi
            sleep 1
          done
          echo "web ui never became healthy" >&2
          docker logs dc-test-open || true
          exit 1

      - name: No header is accepted with role admin by default
        run: |
          set -euo pipefail
          body="$(docker exec dc-test-open curl -s http://127.0.0.1:8088/api/me)"
          echo "$body"
          echo "$body" | grep -q '"role":"admin"'

      - name: Clean up container (default auth config)
        if: always()
        run: docker rm -f dc-test-open || true
