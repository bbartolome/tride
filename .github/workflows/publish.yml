name: Publish image

# paths-ignore rather than an allow-list of paths: a `paths:` filter also
# applies to tag pushes, which would silently skip a release tag whose commit
# happened to touch nothing matching.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

env:
  IMAGE: bbartolome/devcontainer
  REGISTRY_IMAGE: docker.io/bbartolome/devcontainer

permissions:
  contents: read

jobs:
  # Each architecture builds natively on its own runner - free for public repos -
  # and pushes an untagged blob identified only by digest. Tagging happens once,
  # in the merge job, so a half-finished matrix never publishes a usable tag.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The image is ~5GB; runners ship with little headroom once the build
      # cache is also on disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            ref_name="${GITHUB_REF_NAME#v}"
            echo "IMAGE_REF=${{ env.IMAGE }}:${ref_name}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_REF=${{ env.IMAGE }}:latest" >> "$GITHUB_ENV"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_REF=${{ env.IMAGE_REF }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: /tmp/digests
        run: |
          # Word splitting is deliberate here: both substitutions expand into
          # multiple arguments (-t tag -t tag ..., then one ref per digest).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # Proves the published image can still hand out its own installer, which is
  # the one behaviour a plain build cannot check.
  smoke:
    name: Smoke test dispenser
    runs-on: ubuntu-24.04
    needs: merge
    steps:
      - name: Dispenser emits a clean, parseable script
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker run --rm -e SETUP=true "$image" > boot.sh
          test -s boot.sh || { echo "dispenser produced no output" >&2; exit 1; }
          bash -n boot.sh
          grep -q '^IMAGE=' boot.sh
          head -5 boot.sh

      - name: Manifest covers both architectures
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}"
          docker buildx imagetools inspect "$image" --raw \
            | jq -e '[.manifests[].platform.architecture] | index("amd64") and index("arm64")'
