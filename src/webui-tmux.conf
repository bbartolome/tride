# tmux config for the devcontainer web UI's terminal sessions.
#
# Lives at src/webui-tmux.conf (repo root `src/`, alongside cmd.sh) rather
# than under src/webui/ deliberately: a bind-mount override of /opt/webui
# must not be able to hide this file out from under TmuxService.
#
# IMPORTANT: do NOT add `set -g default-command ...` here. Its absence is
# precisely what makes tmux start each pane as a *login* shell (tmux
# prefixes argv[0] with `-` when no command is given to new-session), which
# is how the pane picks up the devcontainer .bashrc block, SDKMAN, and the
# npm-global PATH additions. Setting default-command would start a plain,
# non-login shell and silently break all of that. If you are tempted to set
# it for some other reason, don't — add the behaviour elsewhere instead.

set -g history-limit 50000
set -g mouse on
set -g status off
set -g default-terminal "xterm-256color"
set -g escape-time 10
set -g window-size latest
set -g destroy-unattached off
setw -g aggressive-resize on
