services:

  tailscale:
    image: tailscale/tailscale:latest
    restart: unless-stopped
    # TS_AUTHKEY arrives via .secret rather than .env: compose only interpolates
    # ${...} from .env, so env_file is how the key reaches the container without
    # sitting in the world-readable config file.
    env_file:
      - .secret
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=${TS_HOSTNAME}
      - TS_SERVE_CONFIG=/config/serve.json
    # Published here, not on devcontainer, because devcontainer shares this
    # service's network namespace. Loopback-only: a fallback for when the
    # tailnet is unreachable.
    ports:
      - "127.0.0.1:${SSH_PORT:-2222}:22"
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    volumes:
      - ts-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro

  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SSH_USER: ${SSH_USER}
        HOST_HOME_DIR: ${HOST_HOME_DIR}
        BASE_IMAGE: ${BASE_IMAGE:-bbartolome/tride:latest}
    image: devcontainer
    container_name: devcontainer
    restart: unless-stopped
    network_mode: "service:tailscale"
    # cmd.sh is PID 1 and does not exec sshd, so it stays around as the
    # parent of the daemonized tmux server the web UI spawns; init: true
    # gives it tini so that server (and any other adopted child) gets reaped.
    init: true
    environment:
      - WEBUI_ENABLED=${WEBUI_ENABLED:-true}
      - WEBUI_ADMIN_LOGINS=${WEBUI_ADMIN_LOGINS:-}
      - WEBUI_PORT=${WEBUI_PORT:-8088}
    volumes:
      - ${HOME}/.gitconfig:${HOST_HOME_DIR}/${SSH_USER}/.gitconfig
      - ${HOME}/.bashrc.ext:${HOST_HOME_DIR}/${SSH_USER}/.bashrc.ext
      - ${HOME}/.ssh:${HOST_HOME_DIR}/${SSH_USER}/.ssh
      - ${HOME}/.cline:${HOST_HOME_DIR}/${SSH_USER}/.cline
      - ${HOME}/.claude:${HOST_HOME_DIR}/${SSH_USER}/.claude
      - ${HOME}/.config:${HOST_HOME_DIR}/${SSH_USER}/.config
      - ${HOME}/Cline:${HOST_HOME_DIR}/${SSH_USER}/Cline
      - ${HOME}/.vscode-server:${HOST_HOME_DIR}/${SSH_USER}/.vscode-server
      - ${HOME}/workspace:${HOST_HOME_DIR}/${SSH_USER}/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      # Consumed and truncated in place by cmd.sh on first start.
      - ./.sudopass:/run/devcontainer/sudopass
      - npm-global:${HOST_HOME_DIR}/${SSH_USER}/.npm-global
      # Path must match cmd.sh's start_webui default for WEBUI_STATE_DIR
      # (/var/lib/devcontainer-webui), which is also the API's own tested
      # default in webui-config.service.ts — all three must stay in lockstep.
      - webui-state:/var/lib/devcontainer-webui

volumes:
  ts-state:
  npm-global:
  webui-state:
