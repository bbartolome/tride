<header class="toolbar">
  <a class="back" [routerLink]="['/repo', ...repoSegments()]">‹ {{ repo() }}</a>
  <div class="file-info">
    <span class="file-path">{{ file() }}</span>
    <span class="badge" [class.staged]="stagedBool()" [class.unstaged]="!stagedBool()">
      {{ stagedBool() ? 'staged' : 'unstaged' }}
    </span>
  </div>
</header>

@if (status() === 'error') {
  <app-empty-state
    [message]="error()?.message ?? 'Failed to load the diff.'"
    [retry]="reload"
  />
} @else if (status() === 'loading') {
  <p class="loading">Loading diff…</p>
} @else if (binary()) {
  <app-empty-state message="Binary file — no preview." />
} @else if (hunks().length === 0) {
  <app-empty-state message="No differences." />
} @else {
  <app-hunk-list [hunks]="hunks()" />
}
