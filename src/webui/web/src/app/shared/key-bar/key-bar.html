<div class="key-bar" role="toolbar" aria-label="Terminal keys">
  <button
    type="button"
    class="key ctrl"
    [class.armed]="ctrlArmed()"
    [attr.aria-pressed]="ctrlArmed()"
    (click)="toggleCtrl()"
  >
    Ctrl
  </button>
  @for (key of keys; track key.id) {
    <button type="button" class="key" [attr.aria-label]="key.ariaLabel" (click)="pressKey(key)">
      {{ key.label }}
    </button>
  }
</div>
